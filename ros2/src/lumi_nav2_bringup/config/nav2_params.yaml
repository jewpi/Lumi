# Nav2 파라미터 — Lumi 로봇 (차동구동, YDLidar X4 Pro, STM32 모터 보드)
#
# nav2_bringup의 기본 nav2_params.yaml(TurtleBot3 Waffle 기준)에서 출발해
# 이 로봇의 실측치로 바꾼 값들:
#   * 실치수 0.5 m(길이) x 0.4 m(폭) -> robot_radius 대신 footprint 사용
#     (내접 0.20 m, 외접 sqrt(0.25^2 + 0.20^2) = 0.32 m)
#   * 최대 속도 0.15 m/s, 0.25 rad/s
#   * base_footprint 프레임이 없으므로 전부 base_link 기준
#   * DWB -> Regulated Pure Pursuit (라즈베리파이 CPU에서 DWB/MPPI는 부담)
#   * local costmap의 voxel_layer -> obstacle_layer (2D 라이다뿐이라 z축 불필요)
#   * use_sim_time 전부 false (실기)

amcl:
  ros__parameters:
    use_sim_time: false
    # 휠 odom 노이즈 모델. 주행이 안정되면 실측 드리프트에 맞춰 줄인다.
    alpha1: 0.2   # 회전 명령이 만드는 회전 오차
    alpha2: 0.2   # 직진 명령이 만드는 회전 오차
    alpha3: 0.2   # 직진 명령이 만드는 직진 오차
    alpha4: 0.2   # 회전 명령이 만드는 직진 오차
    alpha5: 0.2
    base_frame_id: "base_link"      # 기본값 base_footprint — 이 로봇엔 없다
    odom_frame_id: "odom"
    global_frame_id: "map"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0           # X4-Pro.yaml의 range_max와 일치
    laser_min_range: 0.10           # X4-Pro.yaml의 range_min과 일치
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true              # map -> odom 은 AMCL이 발행
    # 기본 1.0초는 느슨하다. odom이 20 Hz로 들어오므로 0.5로 조인다.
    transform_tolerance: 0.5
    # 느린 로봇이라 기본값(0.25 m / 0.2 rad)보다 자주 갱신한다.
    update_min_d: 0.10
    update_min_a: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # RViz /amcl_pose에서 측정한 고정 시작 위치.
    # 로봇을 다른 곳에 놓고 시작할 때는 반드시 2D Pose Estimate로 다시 잡는다.
    set_initial_pose: true
    initial_pose:
      x: 7.313725270555075
      y: 9.487756629284123
      z: 0.0
      yaw: -0.010846012404

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # launch의 map 인자로 덮어씀

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 0.15 m/s 로봇이 제자리 회전 중일 때 기본값(0.5 m / 10 s)은
      # 오탐으로 "끼임"을 띄운다. 거리는 줄이고 시간은 늘렸다.
      required_movement_radius: 0.25
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # 휠 odom만으로 각도를 정밀하게 맞추려 하면 목표에서 계속 헤맨다.
      yaw_goal_tolerance: 0.50

    FollowPath:
      # DWB(기본값)와 MPPI는 궤적을 수백 개 굴려 평가한다. 파이에서는
      # controller_frequency 20 Hz를 못 지켜 주행이 끊긴다. RPP는 기하학적
      # 추종이라 연산이 거의 없고 차동구동에 잘 맞는다.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.40
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.70
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.25
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      # 곡률 감속의 하한. 반드시 최대 속도보다 낮아야 한다.
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.05
      # 경로 방향으로 먼저 제자리 회전. allow_reversing과 동시 사용 불가.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom       # 휠 odom이 발행하는 프레임
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 0.5 m x 0.4 m 실측 사각형. base_link가 기하 중심이라 앞뒤 대칭.
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 외접 반지름 0.32 m + 여유 0.13 m. 외접보다 작으면 로봇이
        # 벽을 긁고, 너무 크면 좁은 통로가 전부 막힌 것으로 보인다.
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # 회복 동작도 이 로봇의 속도 한계를 넘지 않게 맞춘다.
    max_rotational_vel: 0.25
    min_rotational_vel: 0.075
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # 이 스택의 마지막 관문. cmd_vel_bridge가 여기 출력을 그대로 STM에 쓴다.
    max_velocity: [0.15, 0.0, 0.25]
    min_velocity: [-0.15, 0.0, -0.25]
    max_accel: [0.50, 0.0, 1.5]
    max_decel: [-0.50, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
