# 4단계: 합동 학습용 데이터 설정 (COCO 80 + 새 클래스 1)
# 학습 PC에서 경로를 실제 위치로 수정해 사용.
#
# 최종 폴더 구조 (새 클래스 데이터 + COCO 리플레이를 한 폴더에 병합):
#   dataset/
#     images/train/   ← extract_frames 출력(train) + COCO 리플레이 images/train
#     images/val/     ← extract_frames 출력(val)   + COCO val2017 서브셋(권장 1000장)
#     labels/train/   ← 검수 완료 라벨(새 클래스 id=80 포함) + COCO 리플레이 labels
#     labels/val/
#
# ⚠️ 새 클래스 라벨의 클래스 id는 반드시 80 (Roboflow 내보내기 시 클래스 순서 확인!)

path: ./dataset
train: images/train
val: images/val

