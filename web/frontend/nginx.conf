server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router(history mode) — 새로고침/딥링크 시 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST → 백엔드
    location /api/ {
        # nginx 기본값 1MB로는 도면 업로드(MAX_UPLOAD_BYTES 10MB)와 SLAM 맵 인그레스
        # (MAX_MAP_BYTES 4MB의 base64 ≈ 5.4MB)가 모두 막힌다. 게다가 이때 413을
        # 뱉는 쪽이 FastAPI가 아니라 nginx라, 응답 본문이 HTML 에러 페이지로 와서
        # 로봇 브리지 쪽에서 원인을 찾기 어렵다 — 백엔드 상한이 먼저 걸리게 잡는다.
        client_max_body_size 12m;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → 백엔드 (Upgrade 헤더 필수)
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}